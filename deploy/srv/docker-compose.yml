# Houdini Production Control — operations compose. Copy to the service directory on the server
# (proposed: /srv/Houdini/docker-compose.yml) next to a .env made from env.example.
#
#   docker compose up -d web
#
# Builds nothing and downloads nothing (pull_policy: never): the image must already exist locally,
# built from an approved commit (control/Dockerfile, base pinned by digest). Its tag lives in .env.
# All host paths come from .env so that no server path is written into this public repository.
# `:?` stops compose when a value is missing instead of silently mounting something else.
name: houdini

services:
  web:
    image: koprifossillab/houdini-control:${IMAGE_TAG:?IMAGE_TAG 를 .env 에 넣을 것}
    pull_policy: never
    env_file: [.env]
    environment:
      TZ: Asia/Seoul
      HOST: 0.0.0.0
      PORT: "8097"
      HPC_BASE_PATH: /Houdini
      HPC_AUTH: basic
      # "1" = research views only over HTTPS via the trusted proxy (default). "0" = plain-HTTP portal
      # operation, chosen by the owner on 2026-11-02 because the site VPN only passes port 80.
      HPC_REQUIRE_TLS: "${HPC_REQUIRE_TLS:-1}"
      # the reverse proxy reaches the container through this network's gateway (see networks below)
      HPC_TRUSTED_PROXIES: "${HPC_NET_GATEWAY:?},::ffff:${HPC_NET_GATEWAY:?}"
      HPC_COLLECTOR_DIR: /data/collector
      HPC_LEDGER_DIR: /data/ledger
      HPC_MEDIA_DIR: /data/media
      HPC_MEDIA_MANIFEST: /data/runtime/media.json
    # uid of the image's `node` user; data is read through world-readable files only
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp:size=8m]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    volumes:
      # every input is read-only — the service never writes to them
      - ${HPC_COLLECTOR_HOST_DIR:?수집기 출력 폴더}:/data/collector:ro
      - ${HPC_LEDGER_HOST_DIR:?승인된 제작 저장소 checkout}:/data/ledger:ro
      - ${HPC_MEDIA_HOST_DIR:?미리보기 미디어 폴더}:/data/media:ro
      - ${HPC_MEDIA_MANIFEST_HOST:?미디어 목록 JSON}:/data/runtime/media.json:ro
    ports:
      # loopback only — the one way in from outside is nginx over TLS
      - "127.0.0.1:${HPC_HOST_PORT:-8097}:8097"
    networks: [default]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    ipam:
      config:
        # fixed so the gateway (= the proxy's source address inside the container) is known.
        # pick a subnet no other docker network or site network uses.
        - subnet: ${HPC_NET_SUBNET:?예 10.197.97.0/29}
          gateway: ${HPC_NET_GATEWAY:?예 10.197.97.1}
