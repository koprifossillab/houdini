# Houdini Production Control — operations compose. Copy to the service directory on the server
# (proposed: /srv/Houdini/docker-compose.yml) next to a .env made from env.example.
#
#   docker compose up -d web
#
# Builds nothing and downloads nothing (pull_policy: never): the image must already exist locally,
# built from an approved commit (control/Dockerfile, base pinned by digest). Its tag lives in .env.
# All host paths come from .env so that no server path is written into this public repository.
# `:?` stops compose when a value is missing instead of silently mounting something else.
name: houdini

services:
  web:
    image: koprifossillab/houdini-control:${IMAGE_TAG:?IMAGE_TAG 를 .env 에 넣을 것}
    pull_policy: never
    env_file: [.env]
    environment:
      TZ: Asia/Seoul
      HOST: 0.0.0.0
      PORT: "8097"
      HPC_BASE_PATH: /Houdini
      # basic (default) | off. off outside loopback also needs HPC_ALLOW_OPEN=1 — the owner chose open
      # lab-network operation on 2026-11-02 (like the other lab sites).
      HPC_AUTH: "${HPC_AUTH:-basic}"
      HPC_ALLOW_OPEN: "${HPC_ALLOW_OPEN:-0}"
      # "1" = research views only over HTTPS via the trusted proxy (default). "0" = plain-HTTP portal
      # operation, chosen by the owner on 2026-11-02 because the site VPN only passes port 80.
      HPC_REQUIRE_TLS: "${HPC_REQUIRE_TLS:-1}"
      # the reverse proxy reaches the container through this network's gateway (see networks below)
      HPC_TRUSTED_PROXIES: "${HPC_NET_GATEWAY:?},::ffff:${HPC_NET_GATEWAY:?}"
      HPC_COLLECTOR_DIR: /data/collector
      HPC_LEDGER_DIR: /data/ledger
      HPC_MEDIA_DIR: /data/media
      HPC_MEDIA_MANIFEST: /data/runtime/media.json
      HPC_TEAM_LIVE_DIR: /data/team_live
      HPC_WORK_ACTIVITY_DIR: /data/work_activity
      # 0.2.0 (TC-DASH-003…006): read-only project board sources
      HPC_HANDOFF_DIR: /data/handoff
      HPC_DECISIONS_DIR: /data/decisions
      HPC_NAS_FILM_DIR: /data/nas_film
      HPC_NAS_LAUNCH_DIR: /data/nas_launch
      # director originals: compare-only, inside the film mount on purpose — no separate mount, so a missing
      # folder is never created on the host by docker (TC-DASH-005 ⑥). Excluded from the NAS clue search.
      HPC_DIRECTOR_DIR: /data/nas_film/TC3D_DIRECTOR_DECISIONS
    # uid of the image's `node` user; data is read through world-readable files only
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp:size=8m]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    volumes:
      # every input is read-only — the service never writes to them
      - ${HPC_COLLECTOR_HOST_DIR:?수집기 출력 폴더}:/data/collector:ro
      - ${HPC_LEDGER_HOST_DIR:?승인된 제작 저장소 checkout}:/data/ledger:ro
      - ${HPC_MEDIA_HOST_DIR:?미리보기 미디어 폴더}:/data/media:ro
      - ${HPC_MEDIA_MANIFEST_HOST:?미디어 목록 JSON}:/data/runtime/media.json:ro
      - ${HPC_TEAM_LIVE_HOST_DIR:?팀 세션 수집 출력}:/data/team_live:ro
      - ${HPC_WORK_ACTIVITY_HOST_DIR:?Work 서명 이벤트 출력}:/data/work_activity:ro
      # 0.2.0: handoff cards, decision records (written by teams / ④ on the host), NAS film and launcher folders.
      # Long syntax with create_host_path: false — a missing host folder stops compose instead of docker
      # creating an empty root-owned folder (② QA review of b4cf816).
      - { type: bind, source: "${HPC_HANDOFF_HOST_DIR:?인계 카드 폴더}", target: /data/handoff, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: "${HPC_DECISIONS_HOST_DIR:?판정 기록 폴더}", target: /data/decisions, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: "${HPC_NAS_FILM_HOST_DIR:?NAS 영상 작업 폴더}", target: /data/nas_film, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: "${HPC_NAS_LAUNCH_HOST_DIR:?NAS 실행기 폴더}", target: /data/nas_launch, read_only: true, bind: { create_host_path: false } }
    ports:
      # loopback only — the one way in from outside is nginx over TLS
      - "127.0.0.1:${HPC_HOST_PORT:-8097}:8097"
    networks: [default]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    ipam:
      config:
        # fixed so the gateway (= the proxy's source address inside the container) is known.
        # pick a subnet no other docker network or site network uses.
        - subnet: ${HPC_NET_SUBNET:?예 10.197.97.0/29}
          gateway: ${HPC_NET_GATEWAY:?예 10.197.97.1}
