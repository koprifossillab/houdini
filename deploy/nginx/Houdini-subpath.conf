# Houdini Production Control 을 80 포트의 /Houdini/ 아래에 얹는다.
# 꼴은 같은 서버의 다른 서브경로 뷰어(snippets/*-subpath.conf)를 따랐다 — 포털 server 블록 안에 서브경로로 얹는다.
#
# **운영자 작업(승인 뒤)** — 전체 설정을 덮어쓰지 않는다. 조각 하나 넣고 include 한 줄만 더한다:
#   sudo cp deploy/nginx/Houdini-subpath.conf /etc/nginx/snippets/
#   # 포털 server 블록 안, 다른 *-subpath.conf include 줄 옆에 한 줄:
#   #     include snippets/Houdini-subpath.conf;
#   sudo nginx -t && sudo systemctl reload nginx
# 되돌리기: include 줄을 지우고 조각을 치운 뒤 nginx -t && reload.
#
# 경로 충돌 검토: 이 서비스의 API · 정적 파일 · 미디어는 모두 /Houdini/ 아래(/Houdini/api/, /Houdini/static/,
# /Houdini/media/)에만 있다. 포털의 /api/ · /static/ · /media/ 와 겹치지 않는다. `^~` 가 정규식 location
# (Django 앱 경로)보다 먼저 잡는다. 대소문자 교정 정규식은 `/houdini` 로 시작하는 주소만 잡는다
# (`/dikesync/.../houdini/...` 같은 다른 앱의 하위 경로는 앞부분이 달라 해당 없음).

location = /Houdini-unavailable.html {
    internal;
    root /srv/Houdini/www;
    add_header Cache-Control "no-store" always;
}

location = /Houdini {
    return 301 /Houdini/;
}

location ~* ^/houdini(/.*)?$ {
    return 301 /Houdini$1;
}

location ^~ /Houdini/ {
    error_page 502 504 /Houdini-unavailable.html;
    proxy_intercept_errors on;

    # 끝의 슬래시 — nginx 가 /Houdini/ 를 떼고 넘긴다. 화면은 상대경로만 쓴다(앱은 접두어가 붙어 와도 받는다).
    proxy_pass http://127.0.0.1:8097/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 조회 전용 — 큰 업로드를 받지 않는다. 미디어는 25 MiB 이하.
    client_max_body_size 1k;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}
