# 평문 HTTP 로 들어온 /Houdini 주소를 HTTPS 로 보낸다 — 프록시하지 않는다(F4). **운영자 승인 전 미적용.**
# 포털 server 블록에 include 한 줄만 더한다(전체 설정 덮어쓰기 금지):
#   sudo cp deploy/nginx/Houdini-http-redirect.conf /etc/nginx/snippets/
#   #     include snippets/Houdini-http-redirect.conf;      ← 포털 server 블록 안, 다른 include 옆
#   sudo nginx -t && sudo systemctl reload nginx
# 경로 충돌: /Houdini 로 시작하는 주소만 잡는다. 포털의 /api/ · /static/ · /media/ 와 무관하다.
# 443 이 아닌 포트를 쓰면 아래 https://$host 뒤에 :<포트> 를 붙인다.

location ^~ /Houdini {
    return 301 https://$host$request_uri;
}
location ~* ^/houdini(/.*)?$ {
    return 301 https://$host/Houdini$1;
}
