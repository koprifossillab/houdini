# Houdini Production Control — 포털 80 번 server 블록 안의 /Houdini/ (HTTP 운영, 2026-11-02 소유자 결정).
# 사내 VPN 이 80 만 통과시켜서 다른 연구실 서비스와 같은 꼴로 얹는다. 화면 전체가 로그인 뒤에만 열린다.
# HTTPS 로 옮길 때는 Houdini-https-server.conf + Houdini-http-redirect.conf 로 바꾼다.
# 설치: deploy/host/install-nginx.sh (조각 복사 + include 한 줄 + nginx -t + reload, 실패하면 되돌림)

location = /Houdini-unavailable.html {
    internal;
    root /srv/Houdini/www;
    add_header Cache-Control "no-store" always;
}

# 포털 카드는 소문자 /houdini/ 를 가리킨다 — 정식 주소 /Houdini/ 로 보낸다.
# `^~ /Houdini/` 가 정식 주소를 이 정규식에서 지킨다(무한 301 없음).
location = /Houdini {
    return 301 /Houdini/;
}
location ~* ^/houdini(/.*)?$ {
    return 301 /Houdini$1;
}

location ^~ /Houdini/ {
    error_page 502 504 /Houdini-unavailable.html;
    proxy_intercept_errors on;

    proxy_pass http://127.0.0.1:8097/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 1k;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_cache off;
}
