# Houdini Production Control — HTTPS 전용 server 블록 (F4, 2026-11-02). **운영자 승인 전 미적용.**
#
# 원칙: 연구정보는 TLS 위에서만 오간다. 평문 HTTP 로는 프록시하지 않는다(→ Houdini-http-redirect.conf).
# 기존 포털 server 블록은 고치지 않는다 — 이 파일은 **새** server 블록이다(sites-available 에 새 파일).
#
#   sudo cp deploy/nginx/Houdini-https-server.conf /etc/nginx/sites-available/houdini-control
#   sudo ln -s ../sites-available/houdini-control /etc/nginx/sites-enabled/houdini-control
#   sudo nginx -t && sudo systemctl reload nginx
# 되돌리기: sites-enabled 의 링크를 지우고 nginx -t && reload.
#
# 운영자가 채울 것(<...>): 서버 이름, 인증서·키 경로(사내 CA 또는 기관 인증서), 프록시 토큰 파일.
# 443 이 사내망·VPN 에서 통과하는지 먼저 확인할 것 — 막혀 있으면 열린 다른 TLS 포트를 쓰고 listen 을 바꾼다.
# HSTS 는 넣지 않는다: 같은 호스트의 다른 포털 앱까지 HTTPS 로 강제되기 때문(포털 전체 결정 사항).

server {
    listen 443 ssl;
    http2 on;
    server_name <server name> <server address>;

    ssl_certificate     <path to certificate chain>;
    ssl_certificate_key <path to private key>;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:houdini_tls:1m;
    ssl_session_timeout 1h;

    # 이 블록은 관제실만 다룬다. 그 밖의 주소는 404 (포털은 기존 블록 그대로).
    location / { return 404; }

    location = /Houdini { return 301 /Houdini/; }
    location ~* ^/houdini(/.*)?$ { return 301 /Houdini$1; }

    location = /Houdini-unavailable.html {
        internal;
        root /srv/Houdini/www;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /Houdini/ {
        error_page 502 504 /Houdini-unavailable.html;
        proxy_intercept_errors on;

        # 끝의 슬래시 — /Houdini/ 를 떼고 넘긴다. 앱은 접두어가 붙어 와도 받는다.
        proxy_pass http://127.0.0.1:8097/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 앱은 이 값이 https 이고, 보낸 쪽이 신뢰 프록시(+토큰)일 때만 열람을 허용한다
        proxy_set_header X-Forwarded-Proto https;
        # 토큰 줄은 git 밖 파일에(root 만 읽기): proxy_set_header X-HPC-Proxy-Token "<.env 의 HPC_PROXY_TOKEN>";
        include /etc/nginx/secrets/houdini-proxy-token.conf;

        client_max_body_size 1k;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # 인증 응답·본문이 nginx 디스크 캐시에 남지 않게
        proxy_buffering on;
        proxy_cache off;
    }

    # 인증정보가 접근 로그에 남지 않는다(nginx 기본 combined 형식에는 Authorization 이 없음).
    # 로그 형식을 바꿀 때 $http_authorization 을 넣지 말 것.
}
